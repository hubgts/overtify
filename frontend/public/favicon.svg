<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Overtify">
  <!--
    Losange d'Overtify, repris du logo affiché dans l'interface.

    La couleur doit rester alignée sur `--color-accent`
    (frontend/src/styles/theme.css) : un SVG ne peut pas lire une variable CSS
    du document, la valeur est donc dupliquée ici, à un seul endroit.
  -->
  <rect width="32" height="32" rx="7" fill="#121212" />
  <path d="M16 6.5 25.5 16 16 25.5 6.5 16Z" fill="#a855f7" />
</svg>
