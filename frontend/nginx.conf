server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des réponses textuelles.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # En-têtes de sécurité de base.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les assets buildés portent un hash dans leur nom : cache long sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers statiques de la racine : sans cette règle, le fallback SPA
    # renverrait index.html à leur place et le navigateur les ignorerait.
    location ~* ^/(favicon\.(ico|svg)|favicon-\d+\.png|apple-touch-icon\.png|robots\.txt)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # L'API et le flow OAuth sont proxifiés vers le backend.
    # `backend` est le nom du service dans docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les redirections OAuth sont suivies par le navigateur, pas par Nginx.
        proxy_redirect off;
    }

    # Application monopage : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
